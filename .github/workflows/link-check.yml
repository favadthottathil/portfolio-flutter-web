name: Link check

# Portfolio links (Play Store listings, repos, live demos) rot silently.
# Check them weekly and on demand rather than on every PR, so a third-party
# outage never blocks a merge.
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**/*_data.dart"
      - "lib/features/hero/**"
      - ".lycheeignore"

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200..=299,403,429
            'lib/**/*.dart'
            README.md
          fail: true
